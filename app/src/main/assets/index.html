:500px;border-collapse:collapse;font-size:12px}.register th{background:#eef2ff;padding:9px;text-align:left}.register td{padding:10px 9px;border-bottom:1px solid #edf0f4}.day{padding:11px 0;border-bottom:1px solid #edf0f4}.day small{display:block;color:#687386;margin-top:3px}.day .abs{margin-top:6px;background:#fff4f1;color:#9d3424;border-radius:8px;padding:7px;font-size:11px}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:11px;display:none;z-index:20;font-size:12px}.empty{text-align:center;color:#687386;padding:20px}@media(max-width:520px){.tabs{position:fixed;z-index:10;left:9px;right:9px;bottom:8px;background:#111827ee;padding:6px;border-radius:17px;box-shadow:0 8px 25px #0003}.tab{font-size:11px}.noticeOptions{grid-template-columns:1fr}.actions .btn{flex:1;min-width:125px}}

<script>
setTimeout(()=>document.getElementById("splash")?.classList.add("hide"),1800);
const KEY="teacher-assistant-local-v1";
const DEF={school:"Guru Vasishta Vidhyan",className:"10D",theme:"royal",logo:"",classes:{"10D":["Aarav Kumar","Ananya Singh","Rahul Kumar","Priya Kumari","Rohit Singh"],"10A":["Aarav Kumar","Ananya Singh","Rahul Kumar","Priya Kumari","Rohit Singh"],"10B":["Aman Raj","Neha Kumari","Vikas Kumar","Simran Singh"],"9A":["Aditya Kumar","Riya Singh","Kunal Raj","Pooja Kumari"]},attendanceRecords:[],noticeHistory:[]};
let state=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"));if(localStorage.getItem("ta-logo-migration-v3")!=="1"){state.logo="";localStorage.setItem("ta-logo-migration-v3","1")}state.classes=Object.assign({},DEF.classes,state.classes||{});state.attendanceRecords=state.attendanceRecords||[];state.noticeHistory=state.noticeHistory||[];
let tab="attendance",absent=new Set();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const dateKey=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dateText=()=>new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
const logo=()=>state.logo?'<img class="logo" src="'+state.logo+'">':'<img class="logo" src="data:image/webp;base64,UklGRiYEAABXRUJQVlA4IBoEAABQEgCdASpAAEAAPyFmrFOtJKQit/6oAaAkCWwAnTMADo+zcHenPby8+958zbh8pYN4yy2OWPpTZq/kM1Celyyq11vgeon2oz7dZISkn3T/Fgt4O0EZolnce9/m3kxxCpPL69YjVPWaD1pj+Y6avU8jlXbzcsx5Y21bYWUdPjv/m8EoFrjTafsLJ5o1DUoF10x2G32ezTMmRVVEAAD+9gHbCMXC1A6Kb3clA625GpENP3vsYkyWpncs+m8xYwox+B+XyBV7iTIYoC/9div/FoeWJTveiWWQnOgSWNtLUdsQNHM49TL2u/qV4h63DlscqiKk/VWlo73zrxUC2duuIJFy8dz7G9Y4NDjhE1OU59bCeIfibhMeZMHBl/e67x0w+3tIjY0LWpdSd1Gp6DK13HlvefHW/HW182Hc0JDtzkINQZ0hIMbEUwoS8wMTgXLuYqKSHeOkb3LdJk26Q6QUeLTuDgk3OV7o+FgKna/hwbsi5QtzyFIC3mDM3tFvw/tkHYv3ENX/odRaIX58+k8wLyv7n9kXYtyLr4v1WkqY0IEp+8Ac+RXM88FYIScvosm4FvAgixRXagDg5k2MF7MYZwZuL22Sn8sM8sw/oVU+Hl7drX2PcDQbHTMlfPPHXLrEEZKopAT3qjwRDKRr5Ckte6bjBTCCcUEiVjzhUTDZtOqPQUpSwjc8y+a8UlIzUIIIdkveXLOgsrtYR1RsN0AGC+QoL9gQyQd8zdM3KKASK5h7FnKRhwUdtbF/YVuON3CwBE5e0qQD5WcX2GPwZmD9ppH9qFrhwTMedrMDEmVG3D2ewM1/dMJJm8nGkE4AFL+xURHNgdA7Lq9WkviA8LNXwA59MruBp0vsYIj37a3geSp1B3UKV9WarhvtybTy8Kfud41HVpkECGHYnjwQ3aKZXiDteiLfgdZPRVDq/RRva0aFk3+CHjlBeAC+bxnoxD+I+BI6CilRyWVzCl0fLRCHzwNWjICyOBHoud1tfjX6kuKGQ10guAjP7LaZBJhkHiX/+FOyoL5HlAAeiub8CzzFvSNaeXKeuyY1p1lyaaKmhdV2XXulnpBxtGb/al5iooeTgLh8nqKKzgBzlypeUg6TD/YRZvrtNKKyFfGH+/S85aR+bx/wP+25vUzT0X4A8fIq88+z5YYHFhYm8DrV9lYIUosAtFWnTCtZAfM1DgoZsuD0qz4WCwFk7YnFmkLwfzZX6D9Gcdj00bgWEk8wKurP69NTeB6+gGqqg9BukgEmcU5pKdpK7+u1QE9NjLzjcde0TJx8xA1P1CVYua2g6u+SxbxfGLIJ6PHhPTrnXE68M9/kYq4pML8RiavfL7ZZvP6rVVR8PqP4kfo6t/zDjpU37fw8V4AtWTZvsQrTaKPAqaOUMAcnESbdIxgvwAA=" alt="School logo">';
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function shell(){document.getElementById("root").innerHTML='<div class="app"><header class="top"><div class="brand">'+logo()+'<div><h1>'+esc(state.school)+'</h1><p>Class Teacher: MUKESH KUMAR CHAUHAN</p></div></div><div class="tabs">'+["attendance","register","notice","settings"].map((x,i)=>'<button class="tab '+(tab===x?"active":"")+'" onclick="go(\''+x+'\')">'+["Attendance","Register","Notice","Settings"][i]+"</button>").join("")+'</div></header><main class="content" id="content"></main></div>';render()}
function go(x){tab=x;shell()}
function render(){if(tab==="attendance")attendance();if(tab==="register")register();if(tab==="notice")notice();if(tab==="settings")settings()}
function attendance(){let c=state.className,s=state.classes[c]||[],p=s.length-absent.size;document.getElementById("content").innerHTML='<div class="hero"><div><span class="eyebrow">TODAY’S ATTENDANCE</span><h2>'+esc(c)+' Class</h2><p>'+dateText()+' • Mark absentees and save.</p></div><div class="heroIcon">✓</div></div><div class="card"><div class="row between"><b>My Class</b><span class="pill">SETTINGS</span></div><div class="myclass">'+esc(c)+'</div><div class="muted">Change class from Settings.</div></div><div class="stats"><div class="stat total"><span>Total</span><b>'+s.length+'</b></div><div class="stat present"><span>Present</span><b>'+p+'</b></div><div class="stat absent"><span>Absent</span><b>'+absent.size+'</b></div></div><div class="card"><div class="row between"><div><b>Mark Absentees</b><div class="muted">Tick absent students</div></div><button class="btn secondary" onclick="addStudent()">+ Student</button></div>'+s.map((n,i)=>'<label class="student"><input type="checkbox" '+(absent.has(i)?"checked":"")+' onchange="toggle('+i+')"><span class="roll">'+(i+1)+'</span><span class="name">'+esc(n)+'</span></label>').join("")+'</div><div class="card"><div class="row between"><b>Attendance Message</b><span class="pill">WhatsApp Ready</span></div><div class="message">'+logo()+'<h3>'+esc(state.school)+'</h3><div class="title">CLASS ATTENDANCE</div><div class="muted">'+esc(c)+' • '+dateText()+'</div><div class="messageStats"><div><b>'+s.length+'</b>Total</div><div><b>'+p+'</b>Present</div><div><b>'+absent.size+'</b>Absent</div></div><div style="text-align:left"><b>Absent Students</b><p>'+(absent.size?[...absent].sort((a,b)=>a-b).map(i=>(i+1)+". "+esc(s[i])).join("<br>"):"None — All students are present.")+'</p></div></div><div class="actions"><button class="btn blue" onclick="saveAttendance()">Save Attendance</button><button class="btn green" onclick="share()">Send to WhatsApp</button><button class="btn secondary" onclick="copyReport()">Copy</button></div></div>'}
function toggle(i){absent.has(i)?absent.delete(i):absent.add(i);attendance()}
function addStudent(){let n=prompt("Student name");if(n){state.classes[state.className].push(n.trim());save();attendance()}}
function saveAttendance(){let c=state.className,s=state.classes[c]||[],k=dateKey(),r={date:k,displayDate:dateText(),class:c,total:s.length,present:s.length-absent.size,absent:[...absent].sort((a,b)=>a-b).map(i=>({roll:i+1,name:s[i]}))};let i=state.attendanceRecords.findIndex(x=>x.date===k&&x.class===c);i>=0?state.attendanceRecords[i]=r:state.attendanceRecords.unshift(r);save();toast("Attendance saved in Register")}
function reportText(){let c=state.className,s=state.classes[c]||[],a=[...absent].sort((x,y)=>x-y);return "🏫 "+state.school+"\n\n📋 CLASS ATTENDANCE\nClass: "+c+"\nDate: "+dateText()+"\n\n👥 Total: "+s.length+"\n✅ Present: "+(s.length-a.length)+"\n❌ Absent: "+a.length+"\n\nAbsent Students:\n"+(a.length?a.map(i=>(i+1)+". "+s[i]).join("\n"):"None — All students are present.")+"\n\nRegards,\n"+state.school}
async function share(){saveAttendance();let t=reportText();if(navigator.share){try{await navigator.share({title:"Attendance",text:t})}catch(e){}}else{copyText(t)}}
function copyText(t){try{navigator.clipboard.writeText(t);toast("Copied. Paste in WhatsApp.")}catch(e){toast("Copy unavailable")}}
function copyReport(){saveAttendance();copyText(reportText())}
function register(){let c=state.className,s=state.classes[c]||[],mk=(new Date()).toISOString().slice(0,7),r=state.attendanceRecords.filter(x=>x.class===c&&x.date.startsWith(mk)).sort((a,b)=>a.date.localeCompare(b.date)),abs={};s.forEach((_,i)=>abs[i+1]=0);r.forEach(x=>(x.absent||[]).forEach(a=>abs[a.roll]++));let rows=s.map((n,i)=>{let ab=abs[i+1]||0,pr=Math.max(0,r.length-ab),pc=r.length?Math.round(pr/r.length*100):0;return "<tr><td>"+(i+1)+"</td><td><b>"+esc(n)+"</b></td><td>"+pr+"</td><td>"+ab+"</td><td>"+pc+"%</td></tr>"}).join("");let daily=r.map(x=>"<div class='day'><b>"+esc(x.displayDate||x.date)+"</b><small>"+x.present+" Present • "+x.absent.length+" Absent</small><div class='abs'>"+(x.absent.length?x.absent.map(a=>a.roll+". "+esc(a.name)).join(", "):"All students present")+"</div></div>").join("");document.getElementById("content").innerHTML='<div class="hero"><div><span class="eyebrow">ATTENDANCE REGISTER</span><h2>Monthly Register</h2><p>'+esc(c)+' • '+new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"})+'</p></div><div class="heroIcon">▦</div></div><div class="stats"><div class="stat total"><span>Attendance Days</span><b>'+r.length+'</b></div><div class="stat present"><span>Total Present</span><b>'+r.reduce((n,x)=>n+x.present,0)+'</b></div><div class="stat absent"><span>Total Absent</span><b>'+r.reduce((n,x)=>n+x.absent.length,0)+'</b></div></div><div class="card"><b>Student Register</b><div class="register"><table><thead><tr><th>Roll</th><th>Student</th><th>Present</th><th>Absent</th><th>%</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><b>Daily Attendance</b>'+(daily||'<div class="empty">No attendance saved yet. Mark today’s attendance and tap Save Attendance.</div>')+'</div>'}
function notice(){document.getElementById("content").innerHTML='<div class="noticeHero"><span class="eyebrow">SCHOOL COMMUNICATION</span><h2>Notice Generator</h2><p>AI से औपचारिक एवं द्विभाषी विद्यालय सूचना तैयार करें।</p></div><div class="card"><div class="label">सूचना / निर्देश</div><textarea id="topic" class="field" rows="4" placeholder="उदाहरण: कल local festival की वजह से school बंद रहेगा, सभी students घर पर रहें।"></textarea><div class="noticeOptions"><select id="type" class="field"><option>General Notice</option><option>Holiday Notice</option><option>Parent Meeting</option><option>Exam / Test</option><option>Important Reminder</option></select><button class="btn blue" onclick="genNotice()">✨ AI Generate Notice</button></div><div class="muted">हिंदी, English या Hinglish में लिखें। AI इसे औपचारिक English और Hindi notice में बदल देगा।</div></div><div id="noticeCard" class="card" style="display:none"><div class="notice" id="noticeView"></div><div class="actions"><button class="btn blue" onclick="shareNoticeImage()">🖼️ Share as Image</button><button class="btn green" onclick="shareNotice()">Share Text</button><button class="btn secondary" onclick="copyNotice()">Copy</button></div></div>'}
function freeNoticeRewrite(t,type){
  let s=t.trim().replace(/[.!?]+$/,""),en=s,hi=s;
  const pairs=[
    [/\\bkal\\b|\\btomorrow\\b/gi,"tomorrow","कल"],
    [/\\baaj\\b|\\btoday\\b/gi,"today","आज"],
    [/\\bschool\\s*band\\b|\\bholiday\\b|\\bchhutti\\b|\\bavkash\\b/gi,"the school will remain closed","विद्यालय बंद रहेगा"],
    [/\\bschool\\s*khulega\\b|\\bopen\\b/gi,"the school will remain open","विद्यालय खुला रहेगा"],
    [/\\b12\\s*baje\\b|\\b12\\s*pm\\b/gi,"12:00 PM","दोपहर 12:00 बजे"],
    [/\\b1\\s*baje\\b|\\b1\\s*pm\\b/gi,"1:00 PM","दोपहर 1:00 बजे"],
    [/\\b2\\s*baje\\b|\\b2\\s*pm\\b/gi,"2:00 PM","दोपहर 2:00 बजे"],
    [/\\bparents?\\b/gi,"parents","अभिभावक"],
    [/\\bbaccho?n?\\b|\\bchildren\\b|\\bstudents?\\b/gi,"children/students","बच्चों/विद्यार्थियों"],
    [/\\btime pe\\b|\\btime par\\b|\\bon time\\b/gi,"on time","समय पर"],
    [/\\blene aaye\\b|\\bpick\\s*up\\b/gi,"come to pick up their children","अपने बच्चों को लेने आएँ"],
    [/\\bannual function\\b/gi,"annual function","वार्षिक समारोह"],
    [/\\bexam\\b|\\btest\\b/gi,"examination/test","परीक्षा/परीक्षण"]
  ];
  for(const [re,e,h] of pairs){en=en.replace(re,e);hi=hi.replace(re,h)}
  if(type==="Holiday Notice") en="This is to inform all students and parents that "+en+". The school will remain closed as mentioned above. Kindly take note of the holiday.";
  else if(type==="Parent Meeting") en="All parents are requested to take note of the following information: "+en+". Kindly ensure your presence as required.";
  else if(type==="Exam / Test") en="This is to inform all students and parents that the following examination/test information is important: "+en+". Please make the necessary preparations.";
  else if(type==="Important Reminder") en="This is an important reminder for all students and parents: "+en+". Kindly take note and make the necessary arrangements.";
  else en="This is to inform all students and parents that "+en+". Kindly take note of this information and make the necessary arrangements.";
  if(!/[।]$/.test(hi))hi+="।";
  hi="सभी विद्यार्थियों एवं अभिभावकों को सूचित किया जाता है कि "+hi+" कृपया इस सूचना का ध्यान रखें और आवश्यक व्यवस्था करें।";
  return {english:en.replace(/\\s+/g," ").trim(),hindi:hi.replace(/\\s+/g," ").trim()};
}
async function genNotice(){
  let t=document.getElementById("topic").value.trim(),type=document.getElementById("type").value;
  if(!t)return toast("सूचना लिखें");
  toast("Notice तैयार हो रहा है...");
  const out=freeNoticeRewrite(t,type);
  window.onNativeAiNotice("OK","ENGLISH:\n"+out.english+"\nHINDI:\n"+out.hindi);
}
window.onNativeAiNotice=function(status,payload){if(status!=="OK"){toast(payload||"AI notice failed");return}let text=String(payload||""),m=text.match(/ENGLISH:\s*([\s\S]*?)(?=\n\s*HINDI:|$)/i),h=text.match(/HINDI:\s*([\s\S]*)$/i),en=(m?.[1]||"").trim(),hi=(h?.[1]||"").trim();if(!en||!hi){toast("AI ने अधूरा notice दिया");return}let type=document.getElementById("type").value,d=dateText();state.noticeHistory.unshift({date:d,type,topic:document.getElementById("topic").value.trim(),english:en,hindi:hi});save();document.getElementById("noticeView").innerHTML=logo()+'<h2>'+esc(state.school)+'</h2><div class="rule"></div><b>NOTICE / सूचना</b><div class="muted">Date / दिनांक: '+d+'</div><p><b>'+esc(type)+'</b></p><div class="body"><p><b>Dear Parents/Students,</b></p><p>'+esc(en)+'</p><hr><p class="hindi"><b>प्रिय अभिभावकों एवं विद्यार्थियों</b></p><p class="hindi">'+esc(hi)+'</p></div><p style="text-align:right">Regards / सादर,<br><b>'+esc(state.school)+'</b></p>';document.getElementById("noticeCard").style.display="block";toast("AI notice तैयार है")}
function noticeText(){let n=state.noticeHistory[0];return n?"🏫 "+state.school+"\n\nNOTICE\nDate: "+n.date+"\n"+n.type+"\n\nDear Parents/Students,\n"+n.english+"\n\nप्रिय अभिभावकों/विद्यार्थियों,\n"+n.hindi+"\n\nRegards,\n"+state.school:""}
async function shareNotice(){let t=noticeText();if(navigator.share){try{await navigator.share({title:"School Notice",text:t})}catch(e){}}else copyText(t)}
function copyNotice(){copyText(noticeText())}
async function noticeImageCanvas(){
  let n=state.noticeHistory[0]; if(!n) return null;
  let cv=document.createElement("canvas"),W=1080,H=1450,ctx=cv.getContext("2d");
  let logoImg=null, logoSrc=document.querySelector("#noticeView .logo")?.src;
  if(logoSrc){logoImg=new Image();try{await new Promise((resolve,reject)=>{logoImg.onload=resolve;logoImg.onerror=reject;logoImg.src=logoSrc})}catch(e){logoImg=null}}
  cv.width=W;cv.height=H;
  let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#f8fbff");g.addColorStop(1,"#eef3ff");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#152b7a";ctx.fillRect(0,0,W,22);
  ctx.fillStyle="#ffffff";ctx.fillRect(55,55,W-110,H-110);
  ctx.strokeStyle="#dbe3f2";ctx.lineWidth=2;ctx.strokeRect(55,55,W-110,H-110);
  ctx.textAlign="center";
  if(logoImg){ctx.save();ctx.beginPath();ctx.arc(W/2,105,48,0,Math.PI*2);ctx.clip();ctx.drawImage(logoImg,W/2-48,57,96,96);ctx.restore()}
  ctx.fillStyle="#152b7a";ctx.font="700 42px system-ui";ctx.fillText(state.school,W/2,190);
  ctx.fillStyle="#315bea";ctx.font="800 34px system-ui";ctx.fillText("NOTICE",W/2,225);
  ctx.strokeStyle="#315bea";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(190,255);ctx.lineTo(W-190,255);ctx.stroke();
  ctx.fillStyle="#687386";ctx.font="500 24px system-ui";ctx.fillText("Date: "+n.date,W/2,305);
  ctx.fillStyle="#182033";ctx.font="800 30px system-ui";ctx.fillText(n.type,W/2,365);
  let y=440;
  ctx.textAlign="left";ctx.fillStyle="#182033";ctx.font="700 27px system-ui";ctx.fillText("Dear Parents/Students,",110,y);y+=58;
  y=wrapCanvas(ctx,n.english,110,y,W-220,29,1.65);y+=45;
  ctx.strokeStyle="#e1e6ef";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(110,y);ctx.lineTo(W-110,y);ctx.stroke();y+=50;
  ctx.font="700 27px 'Noto Sans Devanagari',system-ui";ctx.fillText("प्रिय अभिभावकों/विद्यार्थियों,",110,y);y+=58;
  y=wrapCanvas(ctx,n.hindi,110,y,W-220,28,1.7);y+=70;
  ctx.textAlign="right";ctx.fillStyle="#182033";ctx.font="500 25px system-ui";ctx.fillText("Regards,",W-120,y);y+=36;ctx.font="800 27px system-ui";ctx.fillText(state.school,W-120,y);
  return cv;
}
function wrapCanvas(ctx,text,x,y,maxWidth,fontSize,lineHeight){
  ctx.font=(ctx.font.includes("Noto")?"700 ":"500 ")+fontSize+"px "+(ctx.font.includes("Noto")?"'Noto Sans Devanagari',system-ui":"system-ui");
  let words=String(text).split(/\\s+/),line="";
  for(let w of words){let test=line?line+" "+w:w;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);y+=fontSize*lineHeight;line=w}else line=test}
  if(line){ctx.fillText(line,x,y);y+=fontSize*lineHeight}
  return y;
}
async function shareNoticeImage(){
  let cv=await noticeImageCanvas();if(!cv)return toast("Generate a notice first");
  let data=cv.toDataURL("image/png");
  if(window.AndroidShare&&AndroidShare.shareImage){AndroidShare.shareImage(data,"school-notice.png");return}
  try{
    let blob=await (await fetch(data)).blob(),file=new File([blob],"school-notice.png",{type:"image/png"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:"School Notice",files:[file]});return}
    let a=document.createElement("a");a.href=data;a.download="school-notice.png";a.click();toast("Notice image saved");
  }catch(e){toast("Image sharing unavailable")}
}
function settings(){document.getElementById("content").innerHTML='<div class="settingsHero">'+logo()+'<div><span class="eyebrow">SCHOOL PROFILE</span><h2>Settings</h2><p>School name and your class.</p></div></div><div class="card"><div class="label">SCHOOL NAME</div><input id="school" class="field" value="'+esc(state.school)+'"><div class="label">MY CLASS</div><input id="className" class="field" value="'+esc(state.className)+'" placeholder="Example: 10D"><div class="label">SCHOOL LOGO</div><input id="logoInput" type="file" accept="image/*" class="field"><button class="btn blue full" onclick="saveSettings()">Save School Profile</button></div><div class="card"><b>Data</b><p class="muted">This standalone APK stores your attendance and notices on this phone.</p><button class="btn secondary" onclick="resetData()">Reset data</button></div>'}
function saveSettings(){state.school=document.getElementById("school").value.trim()||DEF.school;let c=document.getElementById("className").value.trim().toUpperCase()||"10D";if(!state.classes[c])state.classes[c]=[];state.className=c;let f=document.getElementById("logoInput").files[0];if(f){let rd=new FileReader();rd.onload=()=>{state.logo=rd.result;save();absent.clear();shell();toast("Settings saved")};rd.readAsDataURL(f)}else{save();absent.clear();shell();toast("Settings saved")}}
function resetData(){if(confirm("Reset all app data?")){localStorage.removeItem(KEY);location.reload()}}
shell();
